<!-- Pitchy: floating pitch coach (bottom-right) -->
<style>
    #pitchy-root { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; font-size: 14px; }
    #pitchy-panel { width: 380px; max-width: calc(100vw - 2rem); height: 580px; max-height: calc(100vh - 6rem); }
    @media (max-width: 480px) {
        #pitchy-root { right: 0.5rem; bottom: 0.5rem; }
        #pitchy-panel { max-width: calc(100vw - 1rem); height: calc(100vh - 5.5rem); }
    }
    .pitchy-brand { background-color: #FF5A1F; }  /* brand orange */
    button.pitchy-brand:hover:not(:disabled) { background-color: #F04A0F; }
    .pitchy-md p { margin: 0 0 0.5rem; }
    .pitchy-md p:last-child { margin-bottom: 0; }
    .pitchy-md ul { list-style: disc; padding-left: 1.1rem; margin: 0 0 0.5rem; }
    .pitchy-md li { margin: 0.15rem 0; }
    .pitchy-pop { animation: pitchy-pop 0.18s ease-out; transform-origin: bottom right; }
    @keyframes pitchy-pop { from { opacity: 0; transform: scale(0.95) translateY(6px); } to { opacity: 1; transform: none; } }
    .pitchy-flash { animation: pitchy-flash 2s ease-out; }
    @keyframes pitchy-flash { from { background-color: #FFE4D6; } to { background-color: transparent; } }
    @media (prefers-reduced-motion: reduce) { .pitchy-pop, .pitchy-flash { animation: none; } }
</style>

<div id="pitchy-root" aria-live="polite">
    <!-- Teaser bubble -->
    <div id="pitchy-teaser" class="hidden pitchy-pop mb-3 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-xl border border-gray-200 p-4 relative">
        <button id="pitchy-teaser-close" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 w-6 h-6" aria-label="Dismiss">
            <i class="fas fa-times text-xs"></i>
        </button>
        <p class="text-sm text-gray-800 pr-4"><strong>Hi, I'm Pitchy 👋</strong><br>Need help? I can show you which parts of this pitch to strengthen.</p>
        <div class="mt-3 flex gap-2">
            <button id="pitchy-teaser-review" class="pitchy-brand text-white text-xs font-medium rounded-lg px-3 py-2">Review my pitch</button>
            <button id="pitchy-teaser-chat" class="text-xs font-medium rounded-lg px-3 py-2 border border-gray-300 text-gray-700 hover:bg-gray-50">Ask a question</button>
        </div>
    </div>

    <!-- Chat panel -->
    <div id="pitchy-panel" class="hidden pitchy-pop mb-3 bg-white rounded-2xl shadow-2xl border border-gray-200 flex-col overflow-hidden" role="dialog" aria-label="Pitchy assistant">
        <div class="pitchy-brand text-white px-4 py-3 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-robot text-sm"></i></div>
                <div>
                    <div class="font-semibold leading-tight">Pitchy</div>
                    <div class="text-xs text-white/80 leading-tight">Your pitch deck coach</div>
                </div>
            </div>
            <button id="pitchy-close" class="w-8 h-8 rounded-full hover:bg-white/20" aria-label="Close Pitchy"><i class="fas fa-chevron-down"></i></button>
        </div>

        <div id="pitchy-messages" class="flex-1 overflow-y-auto px-3 py-4 space-y-3 bg-gray-50"></div>

        <div class="border-t border-gray-200 bg-white flex-shrink-0">
            <div id="pitchy-chips" class="flex gap-2 overflow-x-auto px-3 pt-3 pb-1">
                <button class="pitchy-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full border border-primary-200 text-primary-700 bg-primary-50 hover:bg-primary-100" data-action="review">🔍 Review my pitch</button>
                <button class="pitchy-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full border border-gray-200 text-gray-700 hover:bg-gray-50" data-prompt="What questions will investors most likely ask about this pitch, and how should I answer them?">❓ Investor questions</button>
                <button class="pitchy-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full border border-gray-200 text-gray-700 hover:bg-gray-50" data-prompt="Rewrite my weakest section so it's investor-ready.">✨ Fix weakest section</button>
            </div>
            <form id="pitchy-form" class="flex items-end gap-2 p-3">
                <textarea id="pitchy-input" rows="1" maxlength="1000" placeholder="Ask Pitchy about your pitch…"
                    class="flex-1 resize-none border border-gray-300 rounded-xl px-3 py-2 text-sm max-h-28 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"></textarea>
                <button id="pitchy-send" type="submit" class="pitchy-brand text-white rounded-xl w-10 h-10 flex-shrink-0 disabled:opacity-40" aria-label="Send" disabled>
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Launcher -->
    <div class="flex justify-end">
        <button id="pitchy-launcher" class="pitchy-brand text-white w-14 h-14 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition flex items-center justify-center" aria-label="Open Pitchy" aria-expanded="false">
            <i class="fas fa-robot text-xl"></i>
        </button>
    </div>
</div>

<script>
(function() {
    const PROJECT_ID = {{ project.id | tojson }};
    const DISMISS_KEY = 'pitchy-dismissed-' + PROJECT_ID;

    const $ = id => document.getElementById(id);
    const panel = $('pitchy-panel'), teaser = $('pitchy-teaser'), launcher = $('pitchy-launcher');
    const messages = $('pitchy-messages'), input = $('pitchy-input'), sendBtn = $('pitchy-send');

    const history = [];   // [{role: 'user'|'assistant', content}]
    let busy = false;
    let greeted = false;

    // ---------- storage (per-viewer convenience only) ----------
    function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } }

    // ---------- rendering helpers ----------
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    // Minimal, safe Markdown: escape first, then paragraphs, bullets, bold/italic
    function renderMarkdown(text) {
        const blocks = escapeHtml(text).replace(/\r/g, '').split(/\n{2,}/);
        return blocks.map(block => {
            const lines = block.split('\n');
            if (lines.every(l => /^\s*([-*•]|\d+\.)\s+/.test(l))) {
                return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*([-*•]|\d+\.)\s+/, '')) + '</li>').join('') + '</ul>';
            }
            return '<p>' + lines.map(l => inline(l.replace(/^#{1,6}\s+(.*)$/, '**$1**'))).join('<br>') + '</p>';
        }).join('');
    }
    function inline(s) {
        return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<em>$2</em>');
    }

    function scrollToBottom() { messages.scrollTop = messages.scrollHeight; }

    function addBubble(role, html) {
        const row = document.createElement('div');
        if (role === 'user') {
            row.className = 'flex justify-end';
            row.innerHTML = '<div class="pitchy-brand text-white rounded-2xl rounded-br-sm px-3 py-2 max-w-[85%] whitespace-pre-wrap break-words"></div>';
            row.firstChild.textContent = html;
        } else {
            row.className = 'flex items-start gap-2';
            row.innerHTML =
                '<div class="pitchy-brand w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><i class="fas fa-robot text-white text-xs"></i></div>' +
                '<div class="pitchy-body bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-3 py-2 max-w-[85%] text-gray-800 break-words pitchy-md">' + html + '</div>';
        }
        messages.appendChild(row);
        scrollToBottom();
        return row;
    }

    function addError(data) {
        let html = '<p class="text-red-700">' + escapeHtml((data && data.error) || 'Something went wrong. Please try again.') + '</p>';
        if (data && data.details) {
            console.error('Pitchy error details:', data.details);
            html += '<details class="mt-1 text-xs text-gray-500"><summary class="cursor-pointer underline">Learn more</summary>' +
                    '<pre class="mt-1 whitespace-pre-wrap break-words">' + escapeHtml(data.details) + '</pre></details>';
        }
        addBubble('assistant', html);
    }

    function showTyping() {
        const row = addBubble('assistant',
            '<span class="inline-flex gap-1 py-1" aria-label="Pitchy is typing">' +
            '<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>' +
            '<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:.15s"></span>' +
            '<span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:.3s"></span></span>');
        return () => row.remove();
    }

    function setBusy(value) {
        busy = value;
        sendBtn.disabled = value || !input.value.trim();
        document.querySelectorAll('.pitchy-chip, .pitchy-action').forEach(b => { b.disabled = value; b.classList.toggle('opacity-50', value); });
    }

    async function post(url, body) {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        let data = {};
        try { data = await response.json(); } catch (e) { /* non-JSON error page */ }
        if (!response.ok || data.success === false) {
            const err = new Error(data.error || 'Request failed');
            err.data = data.error ? data : { error: 'Something went wrong. Please try again.' };
            throw err;
        }
        return data;
    }

    // ---------- open / close ----------
    function greet() {
        if (greeted) return;
        greeted = true;
        addBubble('assistant', renderMarkdown(
            "Hi! I'm **Pitchy**, your pitch coach. I can review this deck and tell you which sections to strengthen, rewrite a section for you, or answer questions investors might ask.\n\nWhere would you like to start?"));
    }

    function openPanel(focusInput) {
        teaser.classList.add('hidden');
        panel.classList.remove('hidden');
        panel.classList.add('flex');
        launcher.setAttribute('aria-expanded', 'true');
        launcher.innerHTML = '<i class="fas fa-chevron-down text-xl"></i>';
        storageSet(DISMISS_KEY, '1');
        greet();
        if (focusInput) input.focus();
    }

    function closePanel() {
        panel.classList.add('hidden');
        panel.classList.remove('flex');
        launcher.setAttribute('aria-expanded', 'false');
        launcher.innerHTML = '<i class="fas fa-robot text-xl"></i>';
    }

    launcher.addEventListener('click', () => panel.classList.contains('hidden') ? openPanel(true) : closePanel());
    $('pitchy-close').addEventListener('click', closePanel);
    $('pitchy-teaser-close').addEventListener('click', () => { teaser.classList.add('hidden'); storageSet(DISMISS_KEY, '1'); });
    $('pitchy-teaser-review').addEventListener('click', () => { openPanel(false); runReview(); });
    $('pitchy-teaser-chat').addEventListener('click', () => openPanel(true));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.classList.contains('hidden')) closePanel(); });

    // Pop up the greeting once per project (until the user opens or dismisses it)
    if (!storageGet(DISMISS_KEY)) {
        setTimeout(() => { if (panel.classList.contains('hidden')) teaser.classList.remove('hidden'); }, 1500);
    }

    // ---------- review ----------
    function scoreBadge(score) {
        if (score === 0) return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-700">Missing</span>';
        const tone = score <= 2 ? 'bg-red-100 text-red-700' : score === 3 ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700';
        return '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full ' + tone + '">' + score + '/5</span>';
    }

    async function runReview() {
        if (busy) return;
        addBubble('user', 'Review my pitch');
        setBusy(true);
        const stopTyping = showTyping();
        try {
            const data = await post('/api/pitchy-review', { project_id: PROJECT_ID });
            stopTyping();
            let html = data.summary ? renderMarkdown(data.summary) : '';
            html += '<p class="mt-2 mb-1 font-medium">Here\'s where I\'d focus, weakest first:</p><div class="space-y-2">';
            data.sections.forEach((s, i) => {
                html +=
                    '<div class="border border-gray-200 rounded-xl p-2.5 bg-gray-50">' +
                        '<div class="flex items-center justify-between gap-2"><span class="font-medium text-gray-900">' + escapeHtml(s.name) + '</span>' + scoreBadge(s.score) + '</div>' +
                        (s.issue ? '<p class="text-xs text-gray-600 mt-1">' + escapeHtml(s.issue) + '</p>' : '') +
                        (s.suggestion ? '<p class="text-xs text-gray-800 mt-1"><strong>Try:</strong> ' + escapeHtml(s.suggestion) + '</p>' : '') +
                        (s.score < 5 ? '<button class="pitchy-action pitchy-improve mt-2 text-xs font-medium text-primary-700 hover:text-primary-800" data-index="' + i + '">' +
                            (s.score === 0 ? '＋ Add this section' : '✨ Improve this') + '</button>' : '') +
                    '</div>';
            });
            html += '</div>';
            const row = addBubble('assistant', html);
            row.querySelectorAll('.pitchy-improve').forEach(btn => btn.addEventListener('click', () => {
                const s = data.sections[Number(btn.dataset.index)];
                const ask = s.score === 0
                    ? 'Add a "' + s.name + '" section to my pitch. ' + (s.suggestion || '')
                    : 'Rewrite my "' + s.name + '" section. ' + (s.suggestion || '');
                sendMessage(ask.trim());
            }));
            history.push({ role: 'user', content: 'Review my pitch' });
            history.push({ role: 'assistant', content: (data.summary || '') + '\n' +
                data.sections.map(s => '- ' + s.name + ' (' + s.score + '/5): ' + s.suggestion).join('\n') });
        } catch (err) {
            stopTyping();
            addError(err.data);
        } finally {
            setBusy(false);
        }
    }

    // ---------- chat ----------
    async function sendMessage(text) {
        text = (text || '').trim();
        if (!text || busy) return;
        addBubble('user', text);
        input.value = '';
        autosize();
        setBusy(true);
        const stopTyping = showTyping();
        try {
            const data = await post('/api/pitchy-chat', { project_id: PROJECT_ID, message: text, history: history.slice(-10) });
            stopTyping();
            addBubble('assistant', renderMarkdown(data.reply));
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: data.reply });
            if (data.rewrite) showRewrite(data.rewrite);
        } catch (err) {
            stopTyping();
            addError(err.data);
        } finally {
            setBusy(false);
            input.focus();
        }
    }

    function showRewrite(rewrite) {
        const row = addBubble('assistant',
            '<p class="font-medium mb-1">Proposed "' + escapeHtml(rewrite.section) + '" section</p>' +
            '<div class="pitchy-preview relative max-h-40 overflow-hidden border border-primary-200 bg-primary-50 rounded-lg p-2 text-xs text-gray-800 pitchy-md">' +
                renderMarkdown(rewrite.content) + '</div>' +
            '<button class="pitchy-expand text-xs text-primary-700 hover:text-primary-800 mt-1">Show full text</button>' +
            '<div class="flex gap-2 mt-2">' +
                '<button class="pitchy-action pitchy-apply pitchy-brand text-white text-xs font-medium rounded-lg px-3 py-1.5"><i class="fas fa-check mr-1"></i>Apply to pitch</button>' +
                '<button class="pitchy-dismiss text-xs rounded-lg px-3 py-1.5 border border-gray-300 text-gray-700 hover:bg-gray-50">Dismiss</button>' +
            '</div>');
        const preview = row.querySelector('.pitchy-preview');
        const expand = row.querySelector('.pitchy-expand');
        expand.addEventListener('click', () => {
            const collapsed = preview.classList.toggle('max-h-40');
            expand.textContent = collapsed ? 'Show full text' : 'Show less';
        });
        row.querySelector('.pitchy-dismiss').addEventListener('click', () => row.remove());
        row.querySelector('.pitchy-apply').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            setBusy(true);
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Applying…';
            try {
                const data = await post('/api/pitchy-apply', { project_id: PROJECT_ID, section: rewrite.section, content: rewrite.content });
                updatePitch(data.html);
                row.querySelector('.flex.gap-2').remove();
                addUndo(data.section);
            } catch (err) {
                btn.innerHTML = '<i class="fas fa-check mr-1"></i>Apply to pitch';
                addError(err.data);
            } finally {
                setBusy(false);
            }
        });
    }

    function updatePitch(html) {
        const el = document.getElementById('pitch-deck-content');
        if (!el) return;
        el.innerHTML = html;
        el.classList.remove('pitchy-flash');
        void el.offsetWidth;  // restart the highlight animation
        el.classList.add('pitchy-flash');
    }

    function addUndo(section) {
        const row = addBubble('assistant',
            '<p>✅ Updated your <strong>' + escapeHtml(section) + '</strong> section. The previous version is saved.</p>' +
            '<button class="pitchy-action pitchy-undo mt-1 text-xs font-medium text-primary-700 hover:text-primary-800"><i class="fas fa-undo mr-1"></i>Undo</button>');
        row.querySelector('.pitchy-undo').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            setBusy(true);
            try {
                const data = await post('/dashboard/projects/' + encodeURIComponent(PROJECT_ID) + '/revert-content', {});
                updatePitch(data.html);
                btn.outerHTML = '<p class="text-xs text-gray-500 mt-1">Reverted to the previous version.</p>';
            } catch (err) {
                addError(err.data);
            } finally {
                setBusy(false);
            }
        });
    }

    // ---------- input ----------
    function autosize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 112) + 'px';
        sendBtn.disabled = busy || !input.value.trim();
    }
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    $('pitchy-form').addEventListener('submit', e => { e.preventDefault(); sendMessage(input.value); });

    document.querySelectorAll('.pitchy-chip').forEach(chip => chip.addEventListener('click', () => {
        if (chip.dataset.action === 'review') runReview();
        else sendMessage(chip.dataset.prompt);
    }));
})();
</script>
