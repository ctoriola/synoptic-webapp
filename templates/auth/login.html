{% extends "base.html" %}

{% block title %}Log in - PitchPerfectAI{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-16">
    <div class="grid md:grid-cols-2 gap-4 md:gap-5">
        <!-- Brand panel -->
        <div class="pp-slide pp-glow pp-grain hidden md:flex flex-col min-h-[520px]">
            <div class="pp-slide-meta">
                <span class="pp-kicker">PitchPerfectAI</span>
                <span class="pp-kicker">Log in</span>
            </div>
            <p class="pp-tagline text-2xl mt-8 max-w-xs leading-snug">Pick up where you left off: your pitches, Pitchy and your exports.</p>
            <p class="pp-hero-text text-[6.5rem] mt-auto">Welcome<br>back<span class="text-ink">.</span></p>
        </div>

        <!-- Form -->
        <div class="pp-slide bg-white flex flex-col justify-center">
            <div class="max-w-sm w-full mx-auto">
                <img src="{{ url_for('static', filename='brand/mark-orange.png') }}" alt="" class="h-10 w-auto md:hidden mb-6">
                <p class="pp-kicker text-primary-600">Account</p>
                <h1 class="text-4xl mt-2">Log in</h1>
                <p class="mt-2 text-sm text-gray-600">
                    New here? <a href="{{ url_for('auth.register') }}" class="font-semibold text-primary-600">Create an account</a>
                </p>

                <form class="mt-8 space-y-4" method="POST">
                    <div>
                        <label for="email" class="block text-sm text-gray-700 mb-1.5">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required
                               class="block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 sm:text-sm"
                               placeholder="you@company.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm text-gray-700 mb-1.5">Password</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="current-password" required
                                   class="block w-full px-4 py-3 pr-11 border border-gray-300 placeholder-gray-400 sm:text-sm"
                                   placeholder="Your password">
                            <button type="button" onclick="togglePassword('password')" aria-label="Show password"
                                    class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                                <i id="password-icon" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <label for="remember" class="flex items-center gap-2 text-sm text-gray-700 pt-1">
                        <input id="remember" name="remember" type="checkbox" class="h-4 w-4 rounded border-gray-300">
                        Remember me
                    </label>

                    <button type="submit" class="pp-btn pp-btn-primary w-full !mt-6">
                        Log in <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <div class="my-6 flex items-center gap-3 text-xs text-gray-400">
                    <span class="h-px flex-1 bg-gray-200"></span>or<span class="h-px flex-1 bg-gray-200"></span>
                </div>

                <a href="{{ url_for('auth.github_login') }}" class="pp-btn pp-btn-ink w-full">
                    <i class="fab fa-github"></i> Continue with GitHub
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(fieldId) {
    const passwordField = document.getElementById(fieldId);
    const icon = document.getElementById(fieldId + '-icon');
    const show = passwordField.type === 'password';
    passwordField.type = show ? 'text' : 'password';
    icon.classList.toggle('fa-eye', !show);
    icon.classList.toggle('fa-eye-slash', show);
}
</script>
{% endblock %}
